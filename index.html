<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubCheck - Analizzatore Abbonamenti</title>
  <!-- Tailwind CSS per la grafica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header / Navbar -->
  <header class="bg-indigo-600 text-white shadow-md mb-8">
    <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-wallet text-3xl"></i>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">SubCheck</h1>
          <p class="text-xs text-indigo-200">Gestisci e analizza i tuoi abbonamenti</p>
        </div>
      </div>
      <button id="demoBtn" onclick="loadDemoData()" class="text-xs bg-indigo-500 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition">
        <i class="fa-solid fa-magic mr-1"></i> Dati Demo
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 space-y-8">

    <!-- KPI / Summary Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">Spesa Mensile</p>
          <p id="totalMonthly" class="text-3xl font-extrabold text-slate-900 mt-1">€ 0.00</p>
        </div>
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-calendar-days"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">Spesa Annuale</p>
          <p id="totalYearly" class="text-3xl font-extrabold text-indigo-600 mt-1">€ 0.00</p>
        </div>
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-piggy-bank"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">Abbonamenti Attivi</p>
          <p id="totalCount" class="text-3xl font-extrabold text-slate-900 mt-1">0</p>
        </div>
        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>
    </section>

    <!-- Content Grid: Form + List -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Aggiungi Abbonamento -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-circle-plus text-indigo-600"></i> Nuovo Abbonamento
        </h2>

        <form id="subForm" onsubmit="addSubscription(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome Servizio</label>
            <input type="text" id="name" required placeholder="es. Netflix, Spotify, Palestra" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Costo (€)</label>
              <input type="number" id="cost" step="0.01" min="0" required placeholder="9.99" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Frequenza</label>
              <select id="cycle" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                <option value="monthly">Mensile</option>
                <option value="yearly">Annuale</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoria</label>
            <select id="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
              <option value="Intrattenimento">🎬 Intrattenimento</option>
              <option value="Musica">🎵 Musica</option>
              <option value="Lavoro">💼 Lavoro & Produttività</option>
              <option value="Fitness">🏋️ Fitness & Sport</option>
              <option value="Gaming">🎮 Gaming</option>
              <option value="Altro">📦 Altro</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> Aggiungi Abbonamento
          </button>
        </form>
      </section>

      <!-- Elenco Abbonamenti -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-credit-card text-indigo-600"></i> I tuoi Abbonamenti
          </h2>
          <button onclick="clearAll()" class="text-xs text-rose-600 hover:text-rose-800 font-medium transition">
            Elimina Tutti
          </button>
        </div>

        <!-- Lista vuota o piena -->
        <div id="subsContainer" class="space-y-3">
          <!-- Gli abbonamenti appariranno qui -->
        </div>
      </section>

    </div>
  </main>

  <script>
    // Stato dell'applicazione
    let subscriptions = JSON.parse(localStorage.getItem('subcheck_data')) || [];

    // Salva nel localStorage
    function saveData() {
      localStorage.setItem('subcheck_data', JSON.stringify(subscriptions));
      render();
    }

    // Aggiungi abbonamento
    function addSubscription(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const cost = parseFloat(document.getElementById('cost').value);
      const cycle = document.getElementById('cycle').value;
      const category = document.getElementById('category').value;

      if (!name || isNaN(cost)) return;

      const newSub = {
        id: Date.now(),
        name,
        cost,
        cycle,
        category
      };

      subscriptions.push(newSub);
      saveData();

      // Reset form
      document.getElementById('subForm').reset();
    }

    // Elimina abbonamento
    function deleteSub(id) {
      subscriptions = subscriptions.filter(sub => sub.id !== id);
      saveData();
    }

    // Cancella tutto
    function clearAll() {
      if (subscriptions.length === 0) return;
      if (confirm('Sei sicuro di voler eliminare tutti gli abbonamenti?')) {
        subscriptions = [];
        saveData();
      }
    }

    // Carica dati di esempio
    function loadDemoData() {
      subscriptions = [
        { id: 1, name: 'Netflix', cost: 12.99, cycle: 'monthly', category: 'Intrattenimento' },
        { id: 2, name: 'Spotify', cost: 9.99, cycle: 'monthly', category: 'Musica' },
        { id: 3, name: 'Amazon Prime', cost: 49.90, cycle: 'yearly', category: 'Intrattenimento' },
        { id: 4, name: 'Palestra', cost: 45.00, cycle: 'monthly', category: 'Fitness' }
      ];
      saveData();
    }

    // Rendering dell'interfaccia
    function render() {
      const container = document.getElementById('subsContainer');
      container.innerHTML = '';

      let monthlyTotal = 0;
      let yearlyTotal = 0;

      if (subscriptions.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-slate-400">
            <i class="fa-regular fa-folder-open text-4xl mb-3 block"></i>
            Nessun abbonamento inserito. Aggiungine uno per iniziare!
          </div>
        `;
      } else {
        subscriptions.forEach(sub => {
          // Calcoli spesa
          const mCost = sub.cycle === 'monthly' ? sub.cost : sub.cost / 12;
          const yCost = sub.cycle === 'yearly' ? sub.cost : sub.cost * 12;

          monthlyTotal += mCost;
          yearlyTotal += yCost;

          // Card Abbonamento
          const card = document.createElement('div');
          card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-indigo-200 transition';
          card.innerHTML = `
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center font-bold text-slate-600 text-sm">
                ${sub.name.charAt(0).toUpperCase()}
              </div>
              <div>
                <h3 class="font-bold text-slate-800">${sub.name}</h3>
                <div class="flex items-center gap-2 text-xs text-slate-500 mt-0.5">
                  <span class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium">${sub.category}</span>
                  <span>•</span>
                  <span>${sub.cycle === 'monthly' ? 'Mensile' : 'Annuale'}</span>
                </div>
              </div>
            </div>

            <div class="flex items-center space-x-4">
              <div class="text-right">
                <span class="text-base font-bold text-slate-900">€ ${sub.cost.toFixed(2)}</span>
                <span class="text-xs text-slate-400 block">/${sub.cycle === 'monthly' ? 'mese' : 'anno'}</span>
              </div>
              <button onclick="deleteSub(${sub.id})" class="text-slate-400 hover:text-rose-500 p-2 rounded-lg transition" title="Elimina">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // Aggiorna KPI Totali
      document.getElementById('totalMonthly').textContent = `€ ${monthlyTotal.toFixed(2)}`;
      document.getElementById('totalYearly').textContent = `€ ${yearlyTotal.toFixed(2)}`;
      document.getElementById('totalCount').textContent = subscriptions.length;
    }

    // Inizializzazione al caricamento
    render();
  </script>
</body>
</html>
