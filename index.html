<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subradar - Calcolatore Convenienza Abbonamenti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg shadow-lg shadow-indigo-500/30">
          <i class="fa-solid font-bold fa-radar text-2xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Subradar</h1>
          <p class="text-xs text-slate-400">Quanto ti costa davvero ogni ora d'uso?</p>
        </div>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">Database Prezzi 2026 Active</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- Form Aggiunta Abbonamento -->
    <section class="card rounded-2xl p-6 shadow-xl">
      <h2 class="text-lg font-semibold mb-4 text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-indigo-400"></i> Seleziona Abbonamento
      </h2>

      <form id="sub-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- Selezione o Ricerca Abbonamento -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nome Abbonamento (Prezzo Auto-Cercato)</label>
            <input 
              list="subscription-presets" 
              id="sub-name" 
              placeholder="Es. Netflix, Spotify, ChatGPT..." 
              required
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
              oninput="autoFetchPrice()"
            >
            <datalist id="subscription-presets">
              <!-- Popolato in automatico da JS -->
            </datalist>
          </div>

          <!-- Prezzo Automatico (Read-Only) -->
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Prezzo Mensile Ufficiale (€/mese)</label>
            <div class="relative">
              <input 
                type="number" 
                step="0.01" 
                id="sub-price" 
                placeholder="Auto-riempito" 
                readonly
                class="w-full bg-slate-800/60 border border-slate-700/60 rounded-lg px-4 py-2.5 text-indigo-300 font-semibold focus:outline-none cursor-not-allowed"
              >
              <span class="absolute right-3 top-2.5 text-xs text-slate-500">Auto-cercato</span>
            </div>
          </div>

        </div>

        <!-- Ore Utilizzo Settimanale -->
        <div>
          <div class="flex justify-between text-xs font-medium text-slate-400 mb-1">
            <span>Ore di utilizzo stimate a settimana</span>
            <span id="hours-val" class="text-indigo-400 font-bold">5 ore/settimana</span>
          </div>
          <input 
            type="range" 
            id="sub-hours" 
            min="1" 
            max="70" 
            value="5" 
            class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500"
            oninput="document.getElementById('hours-val').innerText = this.value + ' ore/settimana'"
          >
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
          <i class="fa-solid fa-calculator"></i> Aggiungi al Radar
        </button>
      </form>
    </section>

    <!-- Statistiche e Risultati -->
    <section id="results-section" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">I Tuoi Abbonamenti</h2>
        <span id="total-monthly-cost" class="text-sm font-bold text-slate-300">Spesa Totale: 0.00 €/mese</span>
      </div>

      <div id="subscriptions-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Schede Abbonamenti generate dinamicamente -->
      </div>
    </section>

  </main>

  <script>
    // Database integrato dei principali abbonamenti (Prezzi aggiornati 2026)
    const SUBSCRIPTION_DATABASE = [
      { name: "Netflix Standard con pubblicità", price: 6.99 },
      { name: "Netflix Standard", price: 13.99 },
      { name: "Netflix Premium 4K", price: 19.99 },
      { name: "Spotify Individuale", price: 12.14 },
      { name: "Spotify Duo", price: 17.20 },
      { name: "Spotify Famiglia", price: 21.24 },
      { name: "Spotify Studenti", price: 7.07 },
      { name: "Disney+ Standard con pubblicità", price: 6.99 },
      { name: "Disney+ Standard", price: 10.99 },
      { name: "Disney+ Premium 4K", price: 15.99 },
      { name: "DAZN Sports", price: 14.99 },
      { name: "DAZN Goal", price: 19.99 },
      { name: "DAZN Full", price: 46.99 },
      { name: "Amazon Prime", price: 4.99 },
      { name: "YouTube Premium", price: 11.99 },
      { name: "ChatGPT Plus", price: 22.00 },
      { name: "Claude Pro", price: 22.00 },
      { name: "Apple Music", price: 11.99 },
      { name: "Apple One", price: 19.95 },
      { name: "Xbox Game Pass Ultimate", price: 17.99 },
      { name: "PlayStation Plus Extra", price: 13.99 },
      { name: "iCloud+ 200GB", price: 2.99 },
      { name: "Google One 100GB", price: 1.99 }
    ];

    let subscriptions = JSON.parse(localStorage.getItem('subradar_subs')) || [];

    // Popola il datalist delle opzioni
    function initDatalist() {
      const datalist = document.getElementById('subscription-presets');
      datalist.innerHTML = '';
      SUBSCRIPTION_DATABASE.forEach(item => {
        const option = document.createElement('option');
        option.value = item.name;
        option.label = `€${item.price.toFixed(2)}/mese`;
        datalist.appendChild(option);
      });
    }

    // Ricerca automatica prezzo
    function autoFetchPrice() {
      const inputName = document.getElementById('sub-name').value.trim().toLowerCase();
      const priceInput = document.getElementById('sub-price');

      if (!inputName) {
        priceInput.value = '';
        return;
      }

      // Cerca corrispondenza esatta o parziale
      const match = SUBSCRIPTION_DATABASE.find(item => 
        item.name.toLowerCase() === inputName || item.name.toLowerCase().includes(inputName)
      );

      if (match) {
        priceInput.value = match.price.toFixed(2);
      } else {
        priceInput.value = ''; // Inserimento non trovato
      }
    }

    // Calcolo costo orario
    function calculateHourlyRate(price, weeklyHours) {
      const monthlyHours = weeklyHours * 4.33; // Media settimane in un mese
      return price / monthlyHours;
    }

    // Giudizio convenienza
    function getConvenienceBadge(costPerHour) {
      if (costPerHour <= 0.50) {
        return { label: 'Eccellente Valore', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' };
      } else if (costPerHour <= 1.50) {
        return { label: 'Buona Convenienza', color: 'bg-blue-500/10 text-blue-400 border-blue-500/20' };
      } else if (costPerHour <= 3.00) {
        return { label: 'Poco Utilizzato', color: 'bg-amber-500/10 text-amber-400 border-amber-500/20' };
      } else {
        return { label: 'Possibile Spreco', color: 'bg-rose-500/10 text-rose-400 border-rose-500/20' };
      }
    }

    // Renderizza la lista abbonamenti
    function renderSubscriptions() {
      const listContainer = document.getElementById('subscriptions-list');
      const resultsSection = document.getElementById('results-section');
      const totalMonthlyCostEl = document.getElementById('total-monthly-cost');

      listContainer.innerHTML = '';

      if (subscriptions.length === 0) {
        resultsSection.classList.add('hidden');
        return;
      }

      resultsSection.classList.remove('hidden');

      let totalCost = 0;

      subscriptions.forEach((sub, index) => {
        totalCost += parseFloat(sub.price);
        const costPerHour = calculateHourlyRate(sub.price, sub.hours);
        const badge = getConvenienceBadge(costPerHour);

        const card = document.createElement('div');
        card.className = "card rounded-xl p-5 relative border border-slate-700/50 shadow-md flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-white">${sub.name}</h3>
              <button onclick="deleteSubscription(${index})" class="text-slate-500 hover:text-rose-400 transition text-sm">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
            <span class="inline-block text-xs font-semibold px-2.5 py-0.5 rounded border ${badge.color} mb-4">
              ${badge.label}
            </span>
            <div class="space-y-1 text-sm text-slate-300">
              <p class="flex justify-between"><span>Prezzo Mensile:</span> <span class="font-semibold text-white">€${parseFloat(sub.price).toFixed(2)}</span></p>
              <p class="flex justify-between"><span>Uso Settimanale:</span> <span class="font-semibold text-white">${sub.hours} ore</span></p>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center">
            <span class="text-xs text-slate-400">Costo orario reale:</span>
            <span class="text-xl font-bold text-indigo-400">€${costPerHour.toFixed(2)}<span class="text-xs font-normal text-slate-400">/ora</span></span>
          </div>
        `;
        listContainer.appendChild(card);
      });

      totalMonthlyCostEl.innerText = `Spesa Totale: €${totalCost.toFixed(2)}/mese`;
    }

    // Gestione Invio Form
    document.getElementById('sub-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('sub-name').value.trim();
      const price = parseFloat(document.getElementById('sub-price').value);
      const hours = parseInt(document.getElementById('sub-hours').value);

      if (!name || isNaN(price)) {
        alert("Seleziona un abbonamento valido dalla lista o inserisci un nome riconosciuto.");
        return;
      }

      subscriptions.push({ name, price, hours });
      localStorage.setItem('subradar_subs', JSON.stringify(subscriptions));

      // Reset form
      document.getElementById('sub-name').value = '';
      document.getElementById('sub-price').value = '';
      document.getElementById('sub-hours').value = '5';
      document.getElementById('hours-val').innerText = '5 ore/settimana';

      renderSubscriptions();
    });

    // Elimina abbonamento
    function deleteSubscription(index) {
      subscriptions.splice(index, 1);
      localStorage.setItem('subradar_subs', JSON.stringify(subscriptions));
      renderSubscriptions();
    }

    // Inizializzazione
    initDatalist();
    renderSubscriptions();
  </script>
</body>
</html>
